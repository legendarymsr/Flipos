# flipos pacman — apps install into the writable /data app root; the OS root is
# read-only EROFS and is NOT managed by pacman.
[options]
RootDir     = /data/appfs
DBPath      = /data/appfs/var/lib/pacman/
CacheDir    = /data/appfs/var/cache/pacman/pkg/
LogFile     = /data/appfs/var/log/pacman.log
GPGDir      = /data/system/pacman-gpg/
Architecture = aarch64
# Every package must carry a valid signature from the flipos keyring.
SigLevel    = Required DatabaseOptional
ParallelDownloads = 3

[flipos]
# The flipos app repository (set to your repo URL, or a local file:// mirror).
Server = file:///data/appfs/repo
